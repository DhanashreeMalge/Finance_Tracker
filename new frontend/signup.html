
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance Tracker - Create Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            padding: 20px;
        }

        .signup-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #334155;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .signup-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .signup-button:hover {
            background: #1d4ed8;
        }

        .signup-button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #signupMessage {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="signup-card">

        <div class="logo">💰</div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your Finance Tracker account
        </p>

        <form id="signupForm">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input
                    type="number"
                    id="age"
                    placeholder="Enter age"
                    min="1"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>

                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter 10 digit phone number"
                    maxlength="10"
                    required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>

                <textarea
                    id="address"
                    placeholder="Enter your address"
                    required></textarea>
            </div>

            <button
                type="submit"
                class="signup-button"
                id="signupButton">
                Create Account
            </button>

        </form>

        <p id="signupMessage"></p>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>


    <script>

        const REGISTER_URL =
            "http://localhost:8083/api/auth/singup";


        document
            .getElementById("signupForm")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value.trim();

                const age =
                    document.getElementById("age").value;

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                const gender =
                    document.getElementById("gender").value;

                const phone =
                    document.getElementById("phone").value.trim();

                const address =
                    document.getElementById("address").value.trim();

                const message =
                    document.getElementById("signupMessage");

                const button =
                    document.getElementById("signupButton");


                // Check password
                if (password !== confirmPassword) {

                    message.textContent =
                        "❌ Passwords do not match.";

                    message.style.color = "red";

                    return;
                }


                // Check phone
                if (!/^[0-9]{10}$/.test(phone)) {

                    message.textContent =
                        "❌ Please enter a valid 10-digit phone number.";

                    message.style.color = "red";

                    return;
                }


                const user = {

                    username: username,

                    password: password,

                    gender: gender,

                    address: address,

                    age: Number(age),

                    phone: Number(phone)
                };


                button.disabled = true;

                button.textContent = "Creating Account...";

                message.textContent = "";


                try {

                    const response = await fetch(REGISTER_URL, {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(user)

                    });


                    const result = await response.text();


                    if (!response.ok) {

                        throw new Error(result);

                    }


                    message.textContent =
                        "✅ " + result;

                    message.style.color = "green";


                    document
                        .getElementById("signupForm")
                        .reset();


                    setTimeout(function () {

                        window.location.href =
                            "login.html";

                    }, 1500);


                } catch (error) {

                    console.error(
                        "Signup error:",
                        error
                    );

                    message.textContent =
                        "❌ Cannot connect to Spring Boot backend. Make sure it is running on port 8083.";

                    message.style.color = "red";

                }


                button.disabled = false;

                button.textContent =
                    "Create Account";

            });

    </script>

</body>

</html>
